name: Pull Requests

on:
  push:
    branches-ignore:
      - "main"
      - "master"
      - "development"
      - "v*"
  pull_request:
    branches:
      - "v*"
      - "development"

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

