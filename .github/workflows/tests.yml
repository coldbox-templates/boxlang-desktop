name: Test Suites

on:
  workflow_call:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      BOXLANG_DEBUG: true
      ENVIRONMENT: testing
      JDK_VERSION: "21"
    strategy:
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JDK_VERSION }}

      - name: Setup BoxLang
        uses: ortus-boxlang/setup-boxlang@main
        with:
          with-commandbox: true

      - name: Install Dependencies
        run: |
          box install

      - name: Start ${{ matrix.cfengine }} Server
        run: |
          boxlang-miniserver miniserver.json &
          echo "Waiting for server to be ready..."
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:59700/healthcheck && break
            echo "  attempt $i/30 — not ready yet, retrying in 3s..."
            sleep 3
          done

      - name: Run Tests
        run: |
          mkdir -p tests/results
          curl -sf "http://127.0.0.1:59700/tests/runner.bxm?reporter=text"
          box testbox run runner="http://127.0.0.1:59700/tests/runner.bxm" --verbose outputFile=tests/results/test-results outputFormats=json,antjunit

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          junit_files: tests/results/**/*.xml
          check_name: "${{ matrix.cfengine }} Test Results"

      - name: Upload Test Results to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.cfengine }}
          path: |
            tests/results/**/*